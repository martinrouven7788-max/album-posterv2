<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Album Poster Werkstatt</title>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #09090a; color: #f4f4f5; font-family: -apple-system, Inter, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
.spin { display: inline-block; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.search-screen { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
.search-screen h1 { font-size: 22px; margin: 4px 0 4px; }
.sub { color: #888; font-size: 13px; margin: 0 0 20px; }
.back { display: flex; align-items: center; gap: 4px; color: #888; font-size: 13px; margin-bottom: 14px; }
.search-box { display: flex; align-items: center; gap: 10px; background: #16161a; border: 1px solid #2a2a2f; border-radius: 12px; padding: 12px 14px; }
.search-box input { flex: 1; background: none; border: 0; outline: 0; font-size: 15px; }
.error { color: #ff6b6b; font-size: 13px; }
.hint-text { color: #999; font-size: 12px; line-height: 1.5; }
.loading-row { display: flex; align-items: center; gap: 8px; color: #888; font-size: 13px; padding: 16px 0; }

.artist-list { display: flex; flex-direction: column; gap: 2px; margin-top: 16px; }
.artist-row { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-radius: 10px; text-align: left; width: 100%; }
.artist-row:active { background: #16161a; }

.album-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; }
.album-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; background: #16161a; border: 1px solid #232327; border-radius: 12px; padding: 10px; text-align: left; }
.album-cell img, .album-cell .ph { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #222; }
.album-cell strong { font-size: 12px; line-height: 1.3; }
.album-cell small { color: #777; font-size: 11px; }

.workspace header { min-height: 62px; border-bottom: 1px solid #252528; background: #0d0d0f; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; gap: 10px; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand > b { flex-shrink: 0; width: 32px; height: 32px; border-radius: 8px; background: #fff; color: #111; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.brand span { display: block; min-width: 0; overflow: hidden; }
.brand strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-size: 10px; color: #777; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link { font-size: 12px; color: #aaa; text-decoration: underline; flex-shrink: 0; }

.app { max-width: 1100px; margin: auto; }
.stage { padding: 18px 14px 6px; }
.stage-top { display: flex; justify-content: space-between; color: #777; font-size: 9px; letter-spacing: 0.12em; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; }
.stage-top em { font-style: normal; letter-spacing: 0; text-transform: none; }
.poster-wrap { display: grid; place-items: center; background: radial-gradient(circle, #252529, #111114 65%); border: 1px solid #29292d; border-radius: 16px; padding: 20px 10px; }
.hint { display: flex; justify-content: center; text-align: center; color: #777; font-size: 10px; padding: 12px 20px; }

.poster { width: min(420px, 82vw); position: relative; box-shadow: 0 22px 70px #0008; overflow: hidden; touch-action: none; }

.element { position: absolute; user-select: none; touch-action: none; transform-origin: center center; }
.element.selected { outline: 1px dashed #7c9cff; outline-offset: 2px; }
.element img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.element .placeholder { width: 100%; height: 100%; display: grid; place-items: center; background: #2a2a2e; color: #666; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
.text-el { width: 100%; height: 100%; overflow: hidden; }
.poster-bg-blur { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: blur(26px) brightness(0.55) saturate(1.1); z-index: 0; }
.poster-bg-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.55) 65%, rgba(0,0,0,.8)); z-index: 1; }
.element { z-index: 2; }
.palette-el { display: flex; gap: 6px; height: 100%; }
.palette-el span { flex: 1; border-radius: 3px; }
.elements-layer { position: absolute; inset: 0; z-index: 2; }
.handle { position: absolute; width: 26px; height: 26px; background: #fff; color: #111; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 2px 8px #0006; font-size: 13px; }
.handle.resize { right: -13px; bottom: -13px; cursor: nwse-resize; }
.handle.rotate { left: 50%; top: -32px; transform: translateX(-50%); cursor: grab; }

.element-toolbar { display: flex; gap: 8px; padding: 10px 14px 0; max-width: 700px; margin: 0 auto; flex-wrap: wrap; }
.element-toolbar button { display: flex; align-items: center; gap: 6px; background: #18181b; border: 1px solid #2d2d31; border-radius: 9px; padding: 9px 12px; font-size: 12px; }
.element-toolbar button.danger { color: #ff8080; border-color: #4a2929; }

.properties { padding: 14px; max-width: 700px; margin: 8px auto 0; background: #101012; border: 1px solid #232327; border-radius: 12px; }
.properties label { display: flex; flex-direction: column; gap: 5px; font-size: 10px; color: #888; flex: 1; }
.properties select, .properties input[type="url"] { background: #18181b; border: 1px solid #303035; color: #fff; border-radius: 8px; padding: 9px 8px; font-size: 12px; }
.properties textarea { min-height: 60px; background: #18181b; border: 1px solid #303035; color: #fff; border-radius: 8px; padding: 8px; resize: vertical; width:100%; }
.reset-text { font-size: 11px; color: #8ab4ff; margin: -6px 0 12px; text-decoration: underline; }
.bg-presets { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
.bg-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #333; }
.prop-row { display: flex; gap: 14px; margin-bottom: 12px; align-items: end; }
.prop-row input[type="color"] { width: 100%; height: 34px; background: none; border: 1px solid #303035; border-radius: 6px; }
.align-row { flex-wrap: wrap; }
.align-row button { background: #18181b; border: 1px solid #2d2d31; border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #ccc; }
.align-row button.sel { border-color: #fff; color: #fff; }

.controls { border-top: 1px solid #252528; background: #101012; min-height: 300px; }
.tabs { min-height: 54px; border-bottom: 1px solid #29292d; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; color: #777; font-size: 10px; padding: 8px 2px; }
.tabs button.active { color: #fff; box-shadow: inset 0 -2px #fff; }
.panel { padding: 16px; max-width: 700px; margin: auto; }
.panel h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #888; margin: 18px 0 9px; }
.panel h3:first-child { margin-top: 0; }
.editor-tab-hint { color: #888; font-size: 12px; text-align: center; padding-top: 30px; }

.magic { width: 100%; justify-content: center; display: flex; align-items: center; gap: 8px; background: #1b1b1e; color: #eee; border: 1px solid #38383d; border-radius: 10px; padding: 13px; font-weight: 700; font-size: 13px; }
.palette-preview { display: flex; align-items: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.palette-preview span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #333; }
.palette-preview small { color: #777; font-size: 10px; margin-left: 4px; }
.variant-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.variant-grid button { background: #18181b; border: 1px solid #2d2d31; border-radius: 9px; padding: 13px 8px; font-size: 11px; }
.variant-grid button.sel { border-color: #fff; color: #fff; background: #222; }

.formats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.formats button { background: #18181b; border: 1px solid #2d2d31; border-radius: 9px; padding: 11px 6px; font-size: 11px; }
.formats button.sel { border-color: #fff; color: #fff; }
.quality { display: flex; gap: 9px; margin: 18px 0; background: #18181b; padding: 12px; border-radius: 9px; color: #aaa; }
.quality span { display: flex; flex-direction: column; gap: 3px; }
.quality strong { color: #eee; font-size: 12px; }
.quality small { font-size: 10px; }
.export-big { width: 100%; justify-content: center; display: flex; align-items: center; gap: 8px; background: #f4f4f5; color: #111; border-radius: 10px; padding: 13px; font-weight: 800; margin-top: 8px; }
.export-big.secondary { background: #18181b; color: #eee; border: 1px solid #333; }

.save-row { display: flex; gap: 8px; }
.save-row input { flex: 1; background: #18181b; border: 1px solid #303035; color: #fff; border-radius: 8px; padding: 11px; }
.save-row button { display: flex; align-items: center; gap: 6px; background: #f4f4f5; color: #111; border-radius: 8px; padding: 0 14px; font-weight: 700; font-size: 12px; }
.project-list { display: flex; flex-direction: column; gap: 8px; }
.project-row { display: flex; align-items: center; gap: 10px; background: #18181b; border: 1px solid #2a2a2e; border-radius: 10px; padding: 8px; }
.project-row img, .project-row .ph { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #222; }
.project-info { flex: 1; min-width: 0; }
.project-info strong { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-info small { color: #777; font-size: 10px; }
.project-row button { color: #aaa; padding: 8px; }
.project-row button.danger { color: #ff8080; }

@media (min-width: 800px) {
  .app { display: grid; grid-template-columns: 1fr 400px; align-items: start; }
  .stage { border-right: 1px solid #252528; }
  .controls { border-top: 0; }
  .element-toolbar, .properties { max-width: none; }
}

<body>
<div id="app"></div>
<div id="crash-banner" style="display:none;position:fixed;left:0;right:0;bottom:0;background:#3a0d0d;color:#ffb3b3;padding:14px;font-size:12px;font-family:monospace;z-index:9999;white-space:pre-wrap;"></div>
<script>
"use strict";

window.addEventListener("error", (e) => {
  const banner = document.getElementById("crash-banner");
  if (!banner) return;
  const msg = e.message === "Script error." && !e.filename
    ? "Script error. (Fehler in einer extern geladenen Datei, evtl. Netzwerk/CDN blockiert — bitte Internetverbindung prüfen oder Seite neu laden)"
    : `${e.message}\n${e.filename || ""}:${e.lineno || ""}`;
  banner.textContent = "⚠ " + msg;
  banner.style.display = "block";
});

/* ---------- Grunddaten (identisch zum Next.js-Projekt, hier ohne Build) ---------- */

const PAPER_FORMATS = [
  { id: "A4", label: "A4", widthMm: 210, heightMm: 297 },
  { id: "A3", label: "A3", widthMm: 297, heightMm: 420 },
  { id: "A2", label: "A2", widthMm: 420, heightMm: 594 },
  { id: "A1", label: "A1", widthMm: 594, heightMm: 841 },
  { id: "30x40", label: "30×40 cm", widthMm: 300, heightMm: 400 },
  { id: "40x60", label: "40×60 cm", widthMm: 400, heightMm: 600 },
];
const FONTS = ["Inter", "Arial", "Georgia", "Courier New", "Impact", "Trebuchet MS"];
const TARGET_DPI = 300;
const MM_PER_INCH = 25.4;

function uid() { return "id" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function pxAtTargetDpi(fmt) {
  return {
    widthPx: Math.round((fmt.widthMm / MM_PER_INCH) * TARGET_DPI),
    heightPx: Math.round((fmt.heightMm / MM_PER_INCH) * TARGET_DPI),
  };
}

/* ---------- iTunes Search API: kein Key, kein Login, CORS-freundlich ---------- */

async function searchArtists(term) {
  if (!term.trim()) return [];
  const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=musicArtist&limit=15&country=DE`);
  const data = await res.json();
  return (data.results || []).map(a => ({ id: a.artistId, name: a.artistName }));
}

async function getArtistAlbums(artistId) {
  let items = await fetchAlbumList(artistId, "DE");
  if (items.length === 0) items = await fetchAlbumList(artistId, "US");
  const byName = new Map();
  for (const a of items) {
    const key = a.collectionName.toLowerCase().replace(/\(.*?\)/g, "").trim();
    const existing = byName.get(key);
    if (!existing || a.releaseDate < existing.releaseDate) byName.set(key, a);
  }
  return Array.from(byName.values())
    .sort((a, b) => (a.releaseDate < b.releaseDate ? 1 : -1))
    .map(a => ({
      id: a.collectionId,
      name: a.collectionName,
      cover: a.artworkUrl100 ? a.artworkUrl100.replace("100x100bb", "1200x1200bb") : null,
      year: (a.releaseDate || "").slice(0, 4),
    }));
}
async function fetchAlbumList(artistId, country) {
  const res = await fetch(`https://itunes.apple.com/lookup?id=${artistId}&entity=album&limit=200&country=${country}`);
  const data = await res.json();
  return (data.results || []).filter(r => r.wrapperType === "collection");
}

async function getAlbumDetails(albumId) {
  let { info, tracks } = await fetchAlbumDetails(albumId, "DE");
  if (tracks.length === 0) {
    const fallback = await fetchAlbumDetails(albumId, "US");
    if (fallback.tracks.length > 0) { info = fallback.info; tracks = fallback.tracks; }
  }
  return {
    name: info.collectionName || "",
    artist: info.artistName || "",
    year: (info.releaseDate || "").slice(0, 4),
    releaseDate: info.releaseDate || "",
    viewUrl: info.collectionViewUrl || info.trackViewUrl || "",
    cover: info.artworkUrl100 ? info.artworkUrl100.replace("100x100bb", "1200x1200bb") : null,
    tracks,
    totalDurationMs: tracks.reduce((s, t) => s + t.durationMs, 0),
  };
}
async function fetchAlbumDetails(albumId, country) {
  const res = await fetch(`https://itunes.apple.com/lookup?id=${albumId}&entity=song&country=${country}`);
  const data = await res.json();
  const results = data.results || [];
  const info = results.find(r => r.wrapperType === "collection") || {};
  const tracks = results
    .filter(r => r.wrapperType === "track" && r.kind === "song")
    .sort((a, b) => a.trackNumber - b.trackNumber)
    .map(t => ({ name: t.trackName, durationMs: t.trackTimeMillis || 0, trackNumber: t.trackNumber }));
  return { info, tracks };
}

/* ---------- Farbanalyse aus dem Cover ---------- */

function rgbToHex(r, g, b) { return "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join(""); }
function luminance(r, g, b) {
  const [rs, gs, bs] = [r, g, b].map(v => { const c = v / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
  return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
}
function hslOf(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0; const l = (max + min) / 2; const d = max - min;
  if (d !== 0) {
    s = d / (1 - Math.abs(2 * l - 1));
    switch (max) {
      case r: h = ((g - b) / d) % 6; break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4;
    }
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s, l };
}
function fromHsl(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let [r, g, b] = [0, 0, 0];
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
}
function analyzeCoverColors(imageUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const size = 48;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        let r = 0, g = 0, b = 0, n = 0;
        for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; n++; }
        r /= n; g /= n; b /= n;
        const { h, s } = hslOf(r, g, b);
        const background = fromHsl(h, Math.min(s * 0.9, 0.55), 0.16);
        const accent = fromHsl(h, Math.min(s + 0.25, 1), 0.55);
        const text = luminance(r, g, b) > 0.5 ? "#111111" : "#f7f7f7";
        resolve({ dominant: rgbToHex(r, g, b), background, text, accent });
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error("cors"));
    img.src = imageUrl;
  });
}

/* ---------- Design-Varianten ---------- */

function hexToRgb(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function overlayGradient(hex) {
  const { r, g, b } = hexToRgb(hex || "#0c0c0c");
  return `linear-gradient(180deg, rgba(${r},${g},${b},.1), rgba(${r},${g},${b},.55) 65%, rgba(${r},${g},${b},.82))`;
}
function paletteSwatches(dominantHex) {
  const { r, g, b } = hexToRgb(dominantHex);
  const { h, s } = hslOf(r, g, b);
  return [0.24, 0.38, 0.52, 0.66, 0.8].map(l => fromHsl(h, Math.max(s, 0.35), l));
}

function baseEl(over) {
  return Object.assign({
    id: uid(), type: "text", x: 10, y: 10, w: 80, h: 10, rotation: 0,
    fontFamily: "Inter", fontWeight: 700, align: "left", lineHeight: 1.1,
    letterSpacing: 0, opacity: 1, uppercase: false, borderWidth: 0,
    borderColor: "#000000", padding: 0,
  }, over);
}
function tracklistText(album, max = 60) {
  const shown = album.tracks.slice(0, max);
  const lines = shown.map((t, i) => {
    const mins = Math.floor(t.durationMs / 60000);
    const secs = Math.round((t.durationMs % 60000) / 1000).toString().padStart(2, "0");
    return `${String(i + 1).padStart(2, "0")}  ${t.name}  ${mins}:${secs}`;
  });
  if (album.tracks.length > max) lines.push(`+ ${album.tracks.length - max} weitere`);
  return lines.join("\n");
}
function qrTargetUrl(album, el) {
  const q = encodeURIComponent(`${album.artist} ${album.name}`);
  switch (el.target) {
    case "spotify": return `https://open.spotify.com/search/${q}`;
    case "youtube": return `https://www.youtube.com/results?search_query=${q}+full+album`;
    case "custom": return el.customUrl || "";
    default: return album.viewUrl || "";
  }
}

function totalTimeText(album) {
  const totalMin = Math.round(album.totalDurationMs / 60000);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return h > 0 ? `${h} STD ${m} MIN` : `${m} MIN`;
}
function releaseDateText(album) {
  if (!album.releaseDate) return "";
  try {
    return new Date(album.releaseDate).toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
  } catch { return album.year; }
}
function textForField(album, el) {
  if (el.field !== "custom" && el.overrideText != null && el.overrideText !== "") return el.overrideText;
  switch (el.field) {
    case "artist": return album.artist;
    case "album": return album.name;
    case "year": return album.year;
    case "releaseDate": return releaseDateText(album);
    case "duration": return totalTimeText(album);
    case "tracklist": return tracklistText(album);
    case "custom": return el.customText || "";
    default: return "";
  }
}

const DESIGN_VARIANTS = [
  { id: "bloom", name: "Bloom", desc: "Unscharfes Cover als Hintergrund, mit Verlauf, Farbpalette und Trackliste.", bgMode: "blur", build: (album, p) => ({
    background: "#0c0c0c",
    elements: [
      baseEl({ id: "cover", type: "cover", x: 12, y: 6, w: 76, h: 42, borderWidth: 0 }),
      baseEl({ id: "album", field: "album", x: 12, y: 50, w: 76, h: 9, fontSize: 5.5, fontWeight: 900, color: "#ffffff" }),
      baseEl({ id: "artist", field: "artist", x: 12, y: 58, w: 76, h: 5, fontSize: 3, color: "#dddddd" }),
      baseEl({ id: "palette", type: "palette", x: 12, y: 64.5, w: 76, h: 4.5, swatches: paletteSwatches(p.dominant || p.background) }),
      baseEl({ id: "tracklist", field: "tracklist", x: 12, y: 71, w: 76, h: 20, fontSize: 2.1, fontFamily: "Courier New", color: "#e6e6e6", opacity: 0.9, lineHeight: 1.6, columns: album.tracks.length > 16 ? 3 : album.tracks.length > 6 ? 2 : 1 }),

/* ---------- Projekte (localStorage) ---------- */

const STORAGE_KEY = "apw:projects";
function listProjects() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").sort((a, b) => b.updatedAt - a.updatedAt); }
  catch { return []; }
}
function saveProjectToStorage(project) {
  const all = listProjects();
  const idx = all.findIndex(p => p.id === project.id);
  const updated = Object.assign({}, project, { updatedAt: Date.now() });
  if (idx >= 0) all[idx] = updated; else all.push(updated);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
}
function deleteProjectFromStorage(id) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(listProjects().filter(p => p.id !== id)));
}

const root = document.getElementById("app");
function h(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") node.className = attrs[k];
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), attrs[k]);
    else if (k === "html") node.innerHTML = attrs[k];
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
}

function render() {
  try {
    root.innerHTML = "";
    if (state.screen === "search") root.appendChild(renderSearch());
    else if (state.screen === "albums") root.appendChild(renderAlbums());
    else root.appendChild(renderEditor());
  } catch (err) {
    const banner = document.getElementById("crash-banner");
    if (banner) { banner.textContent = "⚠ Fehler beim Anzeigen: " + (err && err.message ? err.message : err); banner.style.display = "block"; }
    console.error(err);
  }
}

// Farbanalyse + passende Variante automatisch anwenden. Fällt bei CORS-Problemen
// beim Cover (kein pixelgenauer Zugriff möglich) auf Standardfarben zurück.
async function applyAutoDesign(variantId) {
  let palette = state.palette;
  try {
    if (!palette) {
      if (!state.album.cover) throw new Error("Kein Cover vorhanden");
      palette = await analyzeCoverColors(state.album.cover);
      state.palette = palette;
    }
  } catch (e) {
    palette = { dominant: "#555555", background: "#111111", text: "#f7f7f7", accent: "#888888" };
  }
  const id = variantId || "bloom";
  const variant = DESIGN_VARIANTS.find(v => v.id === id) || DESIGN_VARIANTS[0];
  const built = variant.build(state.album, palette);
  state.elements = built.elements;
  state.background = built.background;
  state.bgMode = variant.bgMode || "solid";
  state.selectedId = null;
}

function currentFormat() { return PAPER_FORMATS.find(f => f.id === state.format); }

// Schrumpft Text so lange, bis er in seine Box passt (Breite UND Höhe).
// Setzt immer erst auf die Basisgröße zurück, damit ein größer gezogenes
// Feld die Schrift auch wieder vergrößern kann.
function fitTextBox(textEl) {
  if (!textEl || !textEl.dataset.baseFont) return;
  textEl.style.fontSize = textEl.dataset.baseFont;
  let guard = 0;
  // Grob in 1px-Schritten, dann fein in 0.25px-Schritten — kommt näher an die
  // Box heran, bevor die Mindestgröße erreicht ist (wichtig bei langen Tracklisten).
  while (guard < 90 && (textEl.scrollWidth > textEl.clientWidth + 1 || textEl.scrollHeight > textEl.clientHeight + 1)) {
    const current = parseFloat(getComputedStyle(textEl).fontSize);
    if (!current || current <= 4) break;
    const step = current > 12 ? 1 : 0.25;
    textEl.style.fontSize = (current - step) + "px";
    guard++;
  }
}

function applyElementStyle(node, el) {
  node.style.left = el.x + "%";
  node.style.top = el.y + "%";
  node.style.width = el.w + "%";
  node.style.height = el.h + "%";
  node.style.transform = `rotate(${el.rotation}deg)`;
  node.style.opacity = el.opacity != null ? el.opacity : 1;
  node.style.borderWidth = (el.borderWidth || 0) + "px";
  node.style.borderColor = el.borderColor || "#000";
  node.style.borderStyle = el.borderWidth ? "solid" : "none";
  node.style.padding = (el.padding || 0) + "px";
}

      select.appendChild(o);
    });
    label.appendChild(select);
    box.appendChild(label);

    if (el.target === "custom") {
      const urlLabel = h("label", {}, ["URL"]);
      const urlInput = h("input", { type: "url", placeholder: "https://…", value: el.customUrl || "" });
      urlInput.addEventListener("change", (e) => { el.customUrl = e.target.value; render(); });
      urlLabel.appendChild(urlInput);
      box.appendChild(urlLabel);
    }

    if (el.target === "spotify" || el.target === "youtube") {
      box.appendChild(h("p", { class: "hint-text" }, ["Öffnet eine Suche nach Artist + Album — ein direkter Link ist ohne Anmeldung bei dem Dienst nicht möglich."]));
    }

    box.appendChild(rangeRow([
      ["Rotation", el.rotation, -25, 25, 1, v => { el.rotation = v; refreshElementBox(el); }],
    ]));
  } else {
    box.appendChild(rangeRow([
      ["Rahmen", el.borderWidth, 0, 5, 0.5, v => { el.borderWidth = v; refreshElementBox(el); }],
      ["Rotation", el.rotation, -25, 25, 1, v => { el.rotation = v; refreshElementBox(el); }],
    ]));
  }
  return box;
}

function rangeRow(items) {
  const row = h("div", { class: "prop-row" });
  items.forEach(([labelText, value, min, max, step, onChange]) => {
    const label = h("label", {}, [labelText]);
    const input = h("input", { type: "range", min, max, step, value });
    input.addEventListener("input", (e) => onChange(Number(e.target.value)));
    label.appendChild(input);
    row.appendChild(label);
  });
  return row;
}

// Gezielte DOM-Updates statt komplettem Re-Render, damit Slider nicht ruckeln
// und Eingabefelder ihren Fokus behalten.
function findElementNode(el) {
  const idx = state.elements.indexOf(el);
  const layer = document.getElementById("elements-layer");
  return layer ? layer.children[idx] : null;
}
function refreshElementBox(el) { const node = findElementNode(el); if (node) applyElementStyle(node, el); }
function refreshElementStyleFull(el) { const node = findElementNode(el); if (!node) return; const textEl = node.querySelector(".text-el"); if (!textEl) return;
  textEl.style.fontFamily = el.fontFamily; textEl.style.color = el.color;
  const baseFontCss = `calc(var(--poster-h) * ${(el.fontSize || 3) / 100})`;
  textEl.dataset.baseFont = baseFontCss;
  textEl.style.lineHeight = el.lineHeight;
  fitTextBox(textEl);
}
function refreshElementText(el) { const node = findElementNode(el); if (!node) return; const textEl = node.querySelector(".text-el"); if (textEl) { textEl.textContent = textForField(state.album, el); fitTextBox(textEl); } }

function startMove(el, node, ev) {
  if (state.selectedId !== el.id) { state.selectedId = el.id; render(); }
  ev.preventDefault(); ev.stopPropagation();
  const poster = document.getElementById("poster-node");
  const rect = poster.getBoundingClientRect();
  const startX = ev.clientX, startY = ev.clientY;
  const orig = { x: el.x, y: el.y };
  const curNode = findElementNode(el);
  const move = (e) => {
    const dx = ((e.clientX - startX) / rect.width) * 100;
    const dy = ((e.clientY - startY) / rect.height) * 100;
    el.x = Math.max(0, Math.min(100 - el.w, orig.x + dx));
    el.y = Math.max(0, Math.min(100 - el.h, orig.y + dy));
    if (curNode) { curNode.style.left = el.x + "%"; curNode.style.top = el.y + "%"; }
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function startResize(el, node, ev) {
  ev.preventDefault(); ev.stopPropagation();
  const poster = document.getElementById("poster-node");
  const rect = poster.getBoundingClientRect();
  const startX = ev.clientX, startY = ev.clientY;
  const orig = { w: el.w, h: el.h };
  const textEl = node.querySelector(".text-el");
  const move = (e) => {
    const dx = ((e.clientX - startX) / rect.width) * 100;
    const dy = ((e.clientY - startY) / rect.height) * 100;
    el.w = Math.max(6, Math.min(100 - el.x, orig.w + dx));
    el.h = Math.max(4, Math.min(100 - el.y, orig.h + dy));
    node.style.width = el.w + "%"; node.style.height = el.h + "%";
    if (textEl) fitTextBox(textEl);
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function startRotate(el, node, ev) {
  ev.preventDefault(); ev.stopPropagation();
  const poster = document.getElementById("poster-node");
  const rect = poster.getBoundingClientRect();
  const centerX = rect.left + ((el.x + el.w / 2) / 100) * rect.width;
  const centerY = rect.top + ((el.y + el.h / 2) / 100) * rect.height;
  const move = (e) => {
    const angle = (Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180) / Math.PI;
    el.rotation = Math.round(angle + 90);
    node.style.transform = `rotate(${el.rotation}deg)`;
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

/* ---------- Design-Panel ---------- */

function renderDesignPanel() {
  const panel = h("div", { class: "panel" });
  const btn = h("button", { class: "magic" }, ["✨ Neu generieren (zufällig)"]);
  const errorP = h("p", { class: "hint-text" });
  const paletteBox = h("div", { class: "palette-preview" });

  async function generate(variantId) {
    btn.disabled = true; btn.textContent = "⏳ Generiere…";
    await applyAutoDesign(variantId || DESIGN_VARIANTS[Math.floor(Math.random() * DESIGN_VARIANTS.length)].id);
    render();
  }
  btn.addEventListener("click", () => generate());
  panel.appendChild(btn);
  panel.appendChild(errorP);

  if (state.palette) {
    ["background", "accent", "text"].forEach(k => paletteBox.appendChild(h("span", { style: `background:${state.palette[k]}` })));
    paletteBox.appendChild(h("small", {}, ["Hintergrund · Akzent · Text — aus der Cover-Farbanalyse"]));
    panel.appendChild(paletteBox);
  }

  panel.appendChild(h("h3", {}, ["Varianten"]));
  const grid = h("div", { class: "variant-grid" });
  DESIGN_VARIANTS.forEach(v => {
    grid.appendChild(h("button", {
      class: v.id === currentVariantGuess() ? "sel" : "",
      onclick: () => generate(v.id),
    }, [v.name]));
  });
  panel.appendChild(grid);
  return panel;
}
function currentVariantGuess() {
  // grobe Erkennung anhand vorhandener Element-IDs, nur fürs Hervorheben im Panel
  if (state.elements.some(e => e.type === "palette")) return "bloom";
  if (state.elements.some(e => e.field === "tracklist")) return "tracklist";
  return null;
}

/* ---------- Format / Export Panel ---------- */

function renderFormatPanel() {
  const panel = h("div", { class: "panel" });
  panel.appendChild(h("h3", {}, ["Hintergrund"]));
  const bgRow = h("div", { class: "prop-row" });
  const modeLabel = h("label", {}, ["Modus"]);
  const modeWrap = h("div", { class: "align-row" });
  modeWrap.appendChild(h("button", {
    class: state.bgMode === "blur" ? "sel" : "",
    onclick: () => { state.bgMode = "blur"; applyBackground(state.background); },
  }, ["Foto (unscharf)"]));
  modeWrap.appendChild(h("button", {
    class: state.bgMode === "solid" ? "sel" : "",
    onclick: () => { state.bgMode = "solid"; applyBackground(state.background); },
  }, ["Nur Farbe"]));
  modeLabel.appendChild(modeWrap);
  bgRow.appendChild(modeLabel);
  const colorLabel = h("label", {}, [state.bgMode === "blur" ? "Farbton" : "Farbe"]);
  const colorInput = h("input", { type: "color", value: state.background || "#111111" });
  colorInput.addEventListener("change", (e) => applyBackground(e.target.value));
  colorInput.addEventListener("input", (e) => {
    // Live-Vorschau während des Ziehens, ohne teuren Voll-Rerender bei jedem Tick
    state.background = e.target.value;
    const poster = document.getElementById("poster-node");
    if (poster) {
      if (state.bgMode === "solid") poster.style.background = state.background;
      const overlay = poster.querySelector(".poster-bg-overlay");
      if (overlay) overlay.style.background = overlayGradient(state.background);
    }
  });
  colorLabel.appendChild(colorInput);
  bgRow.appendChild(colorLabel);
  panel.appendChild(bgRow);

  function applyBackground(hex) {
    state.background = hex;
    const rgb = hexToRgb(hex);
    const dark = luminance(rgb.r, rgb.g, rgb.b) > 0.55;
    const textColor = dark ? "#111111" : "#f7f7f7";
    const mutedColor = dark ? "#444444" : "#bbbbbb";
    state.elements.forEach(el => {
      if (el.type !== "text") return;
      el.color = (el.field === "releaseDate" || el.field === "duration") ? mutedColor : textColor;
    });
    render();
  }
  const presets = h("div", { class: "bg-presets" });
  [["#ffffff", "Weiß"], ["#000000", "Schwarz"], ["#f2eee6", "Creme"], ["#111827", "Navy"], ["#7f1d1d", "Rot"], ["#14532d", "Grün"]].forEach(([hex, label]) => {
    const sw = h("button", { class: "bg-swatch", title: label, style: `background:${hex}${hex === "#ffffff" ? ";border-color:#555" : ""}`, onclick: () => applyBackground(hex) });
    presets.appendChild(sw);
  });
  panel.appendChild(presets);
  panel.appendChild(h("p", { class: "hint-text" }, ["Textfarbe passt sich automatisch an die Helligkeit deiner Wahl an (Layout/Bild bleiben wie bei Bloom)."]));

  if (state.bgMode === "blur") panel.appendChild(h("p", { class: "hint-text" }, ["Bei „Foto“ wird die Farbe als Verlaufston über das unscharfe Cover gelegt."]));

  panel.appendChild(h("h3", {}, ["Posterformat"]));
  const grid = h("div", { class: "formats" });
  PAPER_FORMATS.forEach(f => {
    grid.appendChild(h("button", {
      class: state.format === f.id ? "sel" : "",
      onclick: () => { state.format = f.id; render(); },
    }, [f.label]));
  });
  panel.appendChild(grid);

  const fmt = currentFormat();
  const { widthPx, heightPx } = pxAtTargetDpi(fmt);
  const quality = h("div", { class: "quality" });
  quality.appendChild(h("span", {}, ["✓"]));
  const info = h("span", {});
  info.appendChild(h("strong", {}, [`${TARGET_DPI} DPI, echte Druckmaße`]));
  info.appendChild(h("small", {}, [`${fmt.widthMm}×${fmt.heightMm} mm → ${widthPx}×${heightPx} px`]));
  quality.appendChild(info);
  panel.appendChild(quality);

  const pngBtn = h("button", { class: "export-big" }, ["⬇ PNG exportieren"]);
  pngBtn.addEventListener("click", () => runExport("png", pngBtn));
  panel.appendChild(pngBtn);
  const pdfBtn = h("button", { class: "export-big secondary" }, ["📄 PDF exportieren (druckfertig)"]);
  pdfBtn.addEventListener("click", () => runExport("pdf", pdfBtn));
  panel.appendChild(pdfBtn);
  return panel;
}

async function runExport(kind, btn) {
  const node = document.getElementById("poster-node");
  if (!node) return;
  const fmt = currentFormat();
  const { widthPx } = pxAtTargetDpi(fmt);
  const currentWidth = node.getBoundingClientRect().width;
  const pixelRatio = widthPx / currentWidth;
  const filename = `${state.album.artist}-${state.album.name}-${fmt.id}`.replace(/[^a-z0-9-]+/gi, "-");
  const originalLabel = btn.textContent;
  btn.textContent = "⏳ Exportiere…"; btn.disabled = true;
  try {
    const dataUrl = await htmlToImage.toPng(node, { pixelRatio, cacheBust: true, backgroundColor: getComputedStyle(node).backgroundColor });
    if (kind === "png") {
      const a = document.createElement("a");
      a.download = filename + ".png"; a.href = dataUrl; a.click();
    } else {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: fmt.widthMm > fmt.heightMm ? "landscape" : "portrait", unit: "mm", format: [fmt.widthMm, fmt.heightMm] });
      pdf.addImage(dataUrl, "PNG", 0, 0, fmt.widthMm, fmt.heightMm, undefined, "FAST");
      pdf.save(filename + ".pdf");
    }
  } catch (e) {
    alert("Export fehlgeschlagen: " + e.message);
  } finally {
    btn.textContent = originalLabel; btn.disabled = false;
  }
}

/* ---------- Projekte-Panel ---------- */

function renderProjectsPanel() {
  const panel = h("div", { class: "panel" });
  panel.appendChild(h("h3", {}, ["Aktuelles Poster speichern"]));
  const saveRow = h("div", { class: "save-row" });
  const nameInput = h("input", { placeholder: "Projektname…" });
  saveRow.appendChild(nameInput);
  saveRow.appendChild(h("button", {
    onclick: () => {
      saveProjectToStorage({
        id: state.projectId,
        name: nameInput.value.trim() || `${state.album.artist} — ${state.album.name}`,
        createdAt: Date.now(),
        album: state.album, format: state.format, elements: state.elements,
        background: state.background, bgMode: state.bgMode, palette: state.palette,
      });
      render();
    },
  }, ["💾 Speichern"]));
  panel.appendChild(saveRow);

  panel.appendChild(h("h3", {}, ["Meine Poster"]));
  const projects = listProjects();
  if (projects.length === 0) panel.appendChild(h("p", { class: "hint-text" }, ["Noch keine gespeicherten Poster."]));
  const list = h("div", { class: "project-list" });
  projects.forEach(p => {
    const row = h("div", { class: "project-row" });
    row.appendChild(p.album && p.album.cover ? h("img", { src: p.album.cover }) : h("div", { class: "ph" }));
    const info = h("div", { class: "project-info" });
    info.appendChild(h("strong", {}, [p.name]));
    info.appendChild(h("small", {}, [p.album ? `${p.album.artist} — ${p.album.name}` : "—"]));
    row.appendChild(info);
    row.appendChild(h("button", {
      onclick: () => {
        state.projectId = p.id; state.album = p.album; state.elements = p.elements;
        state.background = p.background; state.bgMode = p.bgMode || "solid"; state.palette = p.palette; state.format = p.format;
        state.screen = "editor"; state.tab = "editor"; state.selectedId = null;
        render();
      },
    }, ["📂"]));
    row.appendChild(h("button", { class: "danger", onclick: () => { deleteProjectFromStorage(p.id); render(); } }, ["🗑"]));
    list.appendChild(row);
  });
  panel.appendChild(list);
  return panel;
}

render();
</script>
